[project]
name = "proj"
version = "0.1.0"
description = "Airline Graph-RAG Assistant with Knowledge Graph and LLM Integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pre-commit>=4.5.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.8.0",
    "groq>=0.4.0",
    "streamlit>=1.29.0",
    "streamlit-agraph>=0.0.45",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
    "plotly>=5.18.0",
    "neo4j>=5.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]
