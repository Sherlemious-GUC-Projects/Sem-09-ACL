[project]
name = "src"
version = "0.1.0"
description = "Airline Graph-RAG Assistant with Knowledge Graph and LLM Integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.3.7",
    "langchain>=1.2.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "nltk>=3.9.2",
    "pandas>=2.3.3",
    "pre-commit>=4.5.0",
    "sentence-transformers>=5.2.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "google-generativeai>=0.3.0",
    "anthropic>=0.8.0",
    "groq>=0.4.0",
    "streamlit>=1.29.0",
    "streamlit-agraph>=0.0.45",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
    "plotly>=5.18.0",
    "neo4j>=5.14.0",
    "types-pyyaml>=6.0.12.20250915",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["proj*"]
